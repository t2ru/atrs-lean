name: lean

# 検査の層と実行の時点は docs/rules/checks.md。PR は選択実行（常時の段と、変更に関係する変更時の段）、
# main への push・週次・手動は全数（mise run ci）。PR のブランチへの push は pull_request だけで検査する（二重に起動しない）。
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 17 * * 6"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lean:
    runs-on: ubuntu-latest
    # SQL の差分実行に使う PostgreSQL（版は trace/upstream.json。設定は spec-pivot の lang/sql/dialects/postgresql/harness.md）
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
      # mise.toml のタスクと道具（uv）を信頼する（ADR 44a0）
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      # 選択実行は merge-base からの変更を見るため、履歴をすべて取る
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up Java (upstream uses Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 検査・生成のタスク（mise.toml）と、mise が管理する uv。Python は uv が .python-version に従って用意する（ADR 44a0）
      - name: Set up mise (uv)
        uses: jdx/mise-action@v2
        with:
          install: true
          cache: true

      - name: Cache uv
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock', '.python-version') }}

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake packages and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            .lake
            lean/.lake
            .agents/skills/spec-pivot/assets/lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lean/lean-toolchain', 'lake-manifest.json', 'lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lean/lean-toolchain', 'lake-manifest.json', 'lean/lake-manifest.json') }}-

      # Java の原典実行（backlog f18c）の Maven の依存。原典のビルド物（jp/co/ntt/atrs）は毎回作り直すので除く
      - name: Cache Maven (Java origin run)
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/jp/co/ntt/atrs
            !~/.m2/repository/dev/spec-pivot
          key: m2-${{ runner.os }}-${{ hashFiles('trace/upstream.json', 'tools/origin-run/pom.xml', '.agents/skills/spec-pivot/assets/java/conformance-kit/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-

      - name: Cache Cargo (spec-pivot scripts/trace)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .agents/skills/spec-pivot/scripts/trace/target
          key: cargo-${{ runner.os }}-${{ hashFiles('.agents/skills/spec-pivot/scripts/trace/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Checks (selected by the changes on PRs, all otherwise)
        env:
          CHECK_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          if [ -n "$CHECK_BASE" ]; then mise run check; else mise run ci; fi

      - name: Upload the source/model review (trace review)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-model-review
          path: build/review/
          if-no-files-found: ignore
