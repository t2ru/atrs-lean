name: lean

on:
  push:
  pull_request:

jobs:
  lean:
    runs-on: ubuntu-latest
    # SQL の差分実行に使う PostgreSQL（版は trace/upstream.json。設定は port-lang の postgresql/harness.md）
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up Java (upstream uses Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Lake packages and builds
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            .lake
            lean/.lake
            .agents/skills/port-lang/assets/lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lean/lean-toolchain', 'lake-manifest.json', 'lean/lake-manifest.json') }}-${{ github.sha }}
          restore-keys: |
            lake-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lean/lean-toolchain', 'lake-manifest.json', 'lean/lake-manifest.json') }}-

      - name: Cache Cargo (tools/trace)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tools/trace/target
          key: cargo-${{ runner.os }}-${{ hashFiles('tools/trace/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Lean checks
        run: tools/ci/lean.sh
